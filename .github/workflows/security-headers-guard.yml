name: Security response headers guard

on:
  push:
    paths:
      - "_headers"
      - ".gitignore"
      - "assets/icons/**"
      - "assets/concierge-pet/**"
      - "apple-touch-icon.png"
      - "assets/postal/**"
      - "favicon.ico"
      - "index.html"
      - "install-app.js"
      - "site.webmanifest"
      - "vendor/**"
      - "scripts/build-static-site.js"
      - "scripts/verify-install-app.js"
      - "scripts/verify-concierge-pet.js"
      - "scripts/verify-concierge-pet-runtime.js"
      - "scripts/verify-security-response-headers.js"
      - ".github/workflows/security-headers-guard.yml"
  pull_request:
    paths:
      - "_headers"
      - ".gitignore"
      - "assets/icons/**"
      - "assets/concierge-pet/**"
      - "apple-touch-icon.png"
      - "assets/postal/**"
      - "favicon.ico"
      - "index.html"
      - "install-app.js"
      - "site.webmanifest"
      - "vendor/**"
      - "scripts/build-static-site.js"
      - "scripts/verify-install-app.js"
      - "scripts/verify-concierge-pet.js"
      - "scripts/verify-concierge-pet-runtime.js"
      - "scripts/verify-security-response-headers.js"
      - ".github/workflows/security-headers-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Verify install experience
        run: node scripts/verify-install-app.js
      - name: Verify animated concierge pets
        run: |
          node scripts/verify-concierge-pet.js
          node scripts/verify-concierge-pet-runtime.js
      - name: Build static deployment
        run: node scripts/build-static-site.js
      - name: Verify security response headers
        run: node scripts/verify-security-response-headers.js dist
