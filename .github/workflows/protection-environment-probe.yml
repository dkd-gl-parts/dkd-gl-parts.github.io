name: Non-deploying production boundary probe

on:
  push:
    branches:
      - codex/public-protection-probe-20260909

permissions: {}

jobs:
  environment-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    environment:
      name: production
      deployment: false
    steps:
      - name: Unexpected environment admission
        shell: bash
        run: |
          printf '%s\n' 'UNEXPECTED_ENVIRONMENT_ADMISSION'
          exit 97
