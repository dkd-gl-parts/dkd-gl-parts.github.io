name: Search performance guard

on:
  push:
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "scripts/verify-app-version-assets.js"
      - "scripts/verify-shared-ui-components.js"
      - "scripts/verify-search-workload-guard.js"
      - "scripts/verify-component-catalog-recovery.js"
      - "scripts/verify-component-manual-add.js"
      - "scripts/verify-component-reverse-lookup.js"
      - "scripts/verify-ec-mall-result-performance.js"
      - "scripts/verify-ec-mall-seller-review.js"
      - "scripts/verify-customer-catalog-detail.js"
      - "scripts/verify-customer-category-visibility.js"
      - "scripts/verify-customer-price-list.js"
      - "scripts/verify-customer-order-workflow.js"
      - "scripts/verify-customer-order-delivery-service.js"
      - "scripts/verify-customer-order-b2-import.js"
      - "scripts/verify-customer-order-auto-print.js"
      - "scripts/verify-postal-data.js"
      - "scripts/verify-postal-lookup-fallback.js"
      - "scripts/update-postal-data.js"
      - "assets/postal/**"
      - "docs/customer-order-b2-manual-contract.md"
      - "customer-price-list-print.css"
      - "scripts/verify-manufacturing-cost-candidate-status.js"
      - "scripts/verify-manufacturing-cost-snapshot-status.js"
      - "scripts/verify-manufacturing-cost-target-removal.js"
      - "scripts/verify-sales-pricing-manufacturing-cost.js"
      - "scripts/verify-core-return-policy.js"
      - "scripts/verify-sales-detail-workspace.js"
      - "scripts/verify-product-shipping-estimate.js"
      - "scripts/verify-finished-product-shipments.js"
      - "shipment-instruction-print.css"
      - "scripts/build-static-site.js"
      - "scripts/verify-purchase-multiple-links.js"
      - "manufacturing-ranking-report.js"
      - "scripts/verify-manufacturing-ranking-performance.js"
      - "scripts/verify-manufacturing-ranking-suppliers.js"
      - ".github/workflows/search-performance-guard.yml"
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "scripts/verify-app-version-assets.js"
      - "scripts/verify-shared-ui-components.js"
      - "scripts/verify-search-workload-guard.js"
      - "scripts/verify-component-catalog-recovery.js"
      - "scripts/verify-component-manual-add.js"
      - "scripts/verify-component-reverse-lookup.js"
      - "scripts/verify-ec-mall-result-performance.js"
      - "scripts/verify-ec-mall-seller-review.js"
      - "scripts/verify-customer-catalog-detail.js"
      - "scripts/verify-customer-category-visibility.js"
      - "scripts/verify-customer-price-list.js"
      - "scripts/verify-customer-order-workflow.js"
      - "scripts/verify-customer-order-delivery-service.js"
      - "scripts/verify-customer-order-b2-import.js"
      - "scripts/verify-customer-order-auto-print.js"
      - "scripts/verify-postal-data.js"
      - "scripts/verify-postal-lookup-fallback.js"
      - "scripts/update-postal-data.js"
      - "assets/postal/**"
      - "docs/customer-order-b2-manual-contract.md"
      - "customer-price-list-print.css"
      - "scripts/verify-manufacturing-cost-candidate-status.js"
      - "scripts/verify-manufacturing-cost-snapshot-status.js"
      - "scripts/verify-manufacturing-cost-target-removal.js"
      - "scripts/verify-sales-pricing-manufacturing-cost.js"
      - "scripts/verify-core-return-policy.js"
      - "scripts/verify-sales-detail-workspace.js"
      - "scripts/verify-product-shipping-estimate.js"
      - "scripts/verify-finished-product-shipments.js"
      - "shipment-instruction-print.css"
      - "scripts/build-static-site.js"
      - "scripts/verify-purchase-multiple-links.js"
      - "manufacturing-ranking-report.js"
      - "scripts/verify-manufacturing-ranking-performance.js"
      - "scripts/verify-manufacturing-ranking-suppliers.js"
      - ".github/workflows/search-performance-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-search-workload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify release asset versions
        run: node scripts/verify-app-version-assets.js
      - name: Verify shared customer, internal, and manufacturing UI components
        run: node scripts/verify-shared-ui-components.js
      - name: Verify search workload ordering
        run: node scripts/verify-search-workload-guard.js
      - name: Verify component catalog recovery
        run: node scripts/verify-component-catalog-recovery.js
      - name: Verify manual component add
        run: node scripts/verify-component-manual-add.js
      - name: Verify component reverse lookup
        run: node scripts/verify-component-reverse-lookup.js
      - name: Verify EC mall result performance
        run: node scripts/verify-ec-mall-result-performance.js
      - name: Verify EC mall seller review
        run: node scripts/verify-ec-mall-seller-review.js
      - name: Verify customer catalog detail
        run: node scripts/verify-customer-catalog-detail.js
      - name: Verify customer category visibility
        run: node scripts/verify-customer-category-visibility.js
      - name: Verify customer price list
        run: node scripts/verify-customer-price-list.js
      - name: Verify customer order and manual B2 workflow
        run: node scripts/verify-customer-order-workflow.js
      - name: Verify customer order delivery service
        run: node scripts/verify-customer-order-delivery-service.js
      - name: Verify Yamato B2 issued-data import
        run: node scripts/verify-customer-order-b2-import.js
      - name: Verify customer order automatic printing
        run: node scripts/verify-customer-order-auto-print.js
      - name: Verify offline postal data
        run: node scripts/verify-postal-data.js
      - name: Verify postal lookup fallback
        run: node scripts/verify-postal-lookup-fallback.js
      - name: Verify manufacturing cost candidate status
        run: node scripts/verify-manufacturing-cost-candidate-status.js
      - name: Verify manufacturing cost snapshot status
        run: node scripts/verify-manufacturing-cost-snapshot-status.js
      - name: Verify manufacturing cost target removal
        run: node scripts/verify-manufacturing-cost-target-removal.js
      - name: Verify sales pricing manufacturing cost
        run: node scripts/verify-sales-pricing-manufacturing-cost.js
      - name: Verify core return policy
        run: node scripts/verify-core-return-policy.js
      - name: Verify sales detail workspace
        run: node scripts/verify-sales-detail-workspace.js
      - name: Verify product shipping estimate
        run: node scripts/verify-product-shipping-estimate.js
      - name: Verify finished-product shipment layout and workflow
        run: node scripts/verify-finished-product-shipments.js
      - name: Verify static deployment assets
        run: node scripts/build-static-site.js
      - name: Verify purchase multiple-link management
        run: node scripts/verify-purchase-multiple-links.js
      - name: Verify manufacturing ranking performance
        run: node scripts/verify-manufacturing-ranking-performance.js
      - name: Verify manufacturing ranking supplier report
        run: node scripts/verify-manufacturing-ranking-suppliers.js
      - name: Verify mobile label printer routing
        run: node scripts/verify-finished-label-mobile-print.js
