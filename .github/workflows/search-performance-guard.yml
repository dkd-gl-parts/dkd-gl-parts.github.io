name: Search performance guard

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "install-app.js"
      - "site.webmanifest"
      - "styles.css"
      - "product-3d.js"
      - "product-3d-viewer.js"
      - "vendor/three/**"
      - "scripts/verify-product-3d-workflow.js"
      - "scripts/verify-app-version-assets.js"
      - "scripts/verify-edge-auto-update.js"
      - "scripts/verify-install-app.js"
      - "scripts/verify-shared-ui-components.js"
      - "scripts/verify-search-workload-guard.js"
      - "scripts/verify-component-catalog-recovery.js"
      - "scripts/verify-component-manual-add.js"
      - "scripts/verify-component-language-switching.js"
      - "scripts/verify-system-language-coverage.js"
      - "scripts/verify-component-reverse-lookup.js"
      - "scripts/verify-kikan-management-search.js"
      - "scripts/verify-ec-mall-result-performance.js"
      - "scripts/verify-ec-mall-seller-review.js"
      - "scripts/verify-customer-catalog-detail.js"
      - "scripts/verify-customer-category-visibility.js"
      - "scripts/verify-customer-access-development-default.js"
      - "scripts/verify-customer-price-list.js"
      - "scripts/verify-customer-order-workflow.js"
      - "scripts/verify-customer-order-delivery-service.js"
      - "scripts/verify-customer-order-b2-import.js"
      - "scripts/verify-customer-order-auto-print.js"
      - "scripts/verify-print-settings-screen-ownership.js"
      - "scripts/verify-order-fulfillment-documents.js"
      - "scripts/verify-order-reference-codes.js"
      - "scripts/verify-waybill-layout-designer.js"
      - "scripts/verify-customer-order-batch-accept.js"
      - "scripts/verify-sales-order-dashboard.js"
      - "scripts/verify-sales-order-detail-usability.js"
      - "scripts/verify-customer-order-in-house-cancel.js"
      - "scripts/verify-sales-order-price-adjustment.js"
      - "scripts/verify-sales-accounting-export.js"
      - "scripts/verify-postal-data.js"
      - "scripts/verify-postal-lookup-fallback.js"
      - "scripts/update-postal-data.js"
      - "assets/postal/**"
      - "docs/customer-order-b2-manual-contract.md"
      - "customer-price-list-print.css"
      - "scripts/verify-manufacturing-cost-candidate-status.js"
      - "scripts/verify-manufacturing-cost-snapshot-status.js"
      - "scripts/verify-manufacturing-cost-target-removal.js"
      - "scripts/verify-sales-pricing-manufacturing-cost.js"
      - "scripts/verify-sales-pricing-reference-prices.js"
      - "scripts/verify-sales-pricing-layout.js"
      - "scripts/verify-core-return-policy.js"
      - "scripts/verify-sales-detail-workspace.js"
      - "scripts/verify-product-shipping-estimate.js"
      - "scripts/verify-product-management-auto-code.js"
      - "scripts/verify-product-part-number-validation.js"
      - "scripts/verify-finished-product-shipments.js"
      - "scripts/verify-category-warranty-policy.js"
      - "scripts/verify-customer-order-compatible-serial-dispatch.js"
      - "scripts/verify-production-image-thumbnails-by-kind.js"
      - "scripts/verify-production-workspace-layout.js"
      - "scripts/verify-production-component-summary.js"
      - "scripts/verify-production-stamp-pairs.js"
      - "scripts/verify-image-icon-consistency.js"
      - "assets/icons/image.svg"
      - "shipment-instruction-print.css"
      - "scripts/build-static-site.js"
      - "scripts/verify-purchase-multiple-links.js"
      - "manufacturing-ranking-report.js"
      - "scripts/verify-manufacturing-ranking-performance.js"
      - "scripts/verify-manufacturing-ranking-suppliers.js"
      - ".github/workflows/search-performance-guard.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-search-workload:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check install-app.js
      - name: Verify release asset versions
        run: node scripts/verify-app-version-assets.js
      - name: Verify Edge-compatible automatic updates
        run: node scripts/verify-edge-auto-update.js
      - name: Verify install experience
        run: node scripts/verify-install-app.js
      - name: Verify shared customer, internal, and manufacturing UI components
        run: node scripts/verify-shared-ui-components.js
      - name: Verify search workload ordering
        run: node scripts/verify-search-workload-guard.js
      - name: Verify component catalog recovery
        run: node scripts/verify-component-catalog-recovery.js
      - name: Verify manual component add
        run: node scripts/verify-component-manual-add.js
      - name: Verify component language switching
        run: node scripts/verify-component-language-switching.js
      - name: Verify system-wide language coverage
        run: node scripts/verify-system-language-coverage.js
      - name: Verify component reverse lookup
        run: node scripts/verify-component-reverse-lookup.js
      - name: Verify compatibility management search
        run: node scripts/verify-kikan-management-search.js
      - name: Verify EC mall result performance
        run: node scripts/verify-ec-mall-result-performance.js
      - name: Verify EC mall seller review
        run: node scripts/verify-ec-mall-seller-review.js
      - name: Verify customer catalog detail
        run: node scripts/verify-customer-catalog-detail.js
      - name: Verify customer category visibility
        run: node scripts/verify-customer-category-visibility.js
      - name: Verify customer management development default
        run: node scripts/verify-customer-access-development-default.js
      - name: Verify customer price list
        run: node scripts/verify-customer-price-list.js
      - name: Verify customer order and manual B2 workflow
        run: node scripts/verify-customer-order-workflow.js
      - name: Verify customer order delivery service
        run: node scripts/verify-customer-order-delivery-service.js
      - name: Verify Yamato B2 issued-data import
        run: node scripts/verify-customer-order-b2-import.js
      - name: Verify customer order automatic printing
        run: node scripts/verify-customer-order-auto-print.js
      - name: Verify print-setting screen ownership
        run: node scripts/verify-print-settings-screen-ownership.js
      - name: Verify order fulfillment document workflow
        run: node scripts/verify-order-fulfillment-documents.js
      - name: Verify opaque order and core-return references
        run: node scripts/verify-order-reference-codes.js
      - name: Verify multipart-waybill layout designer
        run: node scripts/verify-waybill-layout-designer.js
      - name: Verify customer order batch acceptance
        run: node scripts/verify-customer-order-batch-accept.js
      - name: Verify sales order operations dashboard
        run: node scripts/verify-sales-order-dashboard.js
      - name: Verify sales order detail usability
        run: node scripts/verify-sales-order-detail-usability.js
      - name: Verify customer order in-house shipment cancellation
        run: node scripts/verify-customer-order-in-house-cancel.js
      - name: Verify sales order price adjustment
        run: node scripts/verify-sales-order-price-adjustment.js
      - name: Verify sales-accounting export
        run: node scripts/verify-sales-accounting-export.js
      - name: Verify offline postal data
        run: node scripts/verify-postal-data.js
      - name: Verify postal lookup fallback
        run: node scripts/verify-postal-lookup-fallback.js
      - name: Verify manufacturing cost candidate status
        run: node scripts/verify-manufacturing-cost-candidate-status.js
      - name: Verify manufacturing cost snapshot status
        run: node scripts/verify-manufacturing-cost-snapshot-status.js
      - name: Verify manufacturing cost target removal
        run: node scripts/verify-manufacturing-cost-target-removal.js
      - name: Verify sales pricing manufacturing cost
        run: node scripts/verify-sales-pricing-manufacturing-cost.js
      - name: Verify sales pricing reference prices
        run: node scripts/verify-sales-pricing-reference-prices.js
      - name: Verify sales pricing responsive layout
        run: node scripts/verify-sales-pricing-layout.js
      - name: Verify core return policy
        run: node scripts/verify-core-return-policy.js
      - name: Verify sales detail workspace
        run: node scripts/verify-sales-detail-workspace.js
      - name: Verify product shipping estimate
        run: node scripts/verify-product-shipping-estimate.js
      - name: Verify product management automatic product code
        run: node scripts/verify-product-management-auto-code.js
      - name: Verify product part-number validation
        run: node scripts/verify-product-part-number-validation.js
      - name: Verify finished-product shipment layout and workflow
        run: node scripts/verify-finished-product-shipments.js
      - name: Verify category warranty and replacement inheritance
        run: node scripts/verify-category-warranty-policy.js
      - name: Verify compatible-product serial dispatch
        run: node scripts/verify-customer-order-compatible-serial-dispatch.js
      - name: Verify production image thumbnails by product kind
        run: node scripts/verify-production-image-thumbnails-by-kind.js
      - name: Verify production management workspace layout
        run: node scripts/verify-production-workspace-layout.js
      - name: Verify production component summary
        run: node scripts/verify-production-component-summary.js
      - name: Verify production F/R stamp-pair management
        run: node scripts/verify-production-stamp-pairs.js
      - name: Verify shared image icon consistency
        run: node scripts/verify-image-icon-consistency.js
      - name: Verify product 3D capture and viewer workflow
        run: node scripts/verify-product-3d-workflow.js
      - name: Verify static deployment assets
        run: node scripts/build-static-site.js
      - name: Verify security response headers
        run: node scripts/verify-security-response-headers.js dist
      - name: Verify purchase multiple-link management
        run: node scripts/verify-purchase-multiple-links.js
      - name: Verify manufacturing ranking performance
        run: node scripts/verify-manufacturing-ranking-performance.js
      - name: Verify manufacturing ranking supplier report
        run: node scripts/verify-manufacturing-ranking-suppliers.js
      - name: Verify mobile label printer routing
        run: node scripts/verify-finished-label-mobile-print.js

  deploy-cloudflare-pages:
    name: Deploy verified frontend to Cloudflare Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify-search-workload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    environment:
      name: production
      url: https://dcats.daiko-denki.co.jp
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Confirm Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not configured." >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not configured." >&2; exit 1; }
      - name: Build static deployment
        run: node scripts/build-static-site.js
      - name: Verify security response headers
        run: node scripts/verify-security-response-headers.js dist
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.124.0"
          command: pages deploy dist --project-name=dcats --branch=main --commit-hash=${{ github.sha }} --commit-dirty=false
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
