{
  "name": "Category warranty browser QA",
  "on": {
    "pull_request": {
      "paths": [
        "app.js",
        "styles.css",
        "index.html",
        "scripts/qa-sales-product-warranty.js",
        ".github/workflows/category-warranty-ui.yml",
        "category-warranty-settings.js",
        "scripts/qa-category-warranty-admin.js",
        "scripts/qa-customer-category-master.js",
        "scripts/qa-hanbaiou-billing-settings.js",
        "sales-pricing-lists.js",
        "sales-pricing-lists.css",
        "scripts/qa-sales-pricing-copy.js",
        "claim-cases.js",
        "scripts/qa-order-claim-intake.js",
        "scripts/qa-sales-pricing-ranks.js",
        "container-stock-import.js",
        "scripts/qa-container-stock-screen.js",
        "scripts/qa-finished-label-print.js",
        "manufacturing-ranking-report.js",
        "scripts/qa-production-report-ranks.js",
        "scripts/qa-mitsubishi-master-search.js",
        "tests/mitsubishi-master-search.cjs",
        "scripts/qa-part-number-alignment.js",
        "shipment-instruction-print.css",
        "scripts/qa-sales-order-inventory.js",
        "scripts/qa-shipping-print-actions.js",
        "tests/sales-order-inventory-fixture.js",
        "scripts/qa-operation-logs.js",
        "warehouse-stock.js",
        "scripts/qa-warehouse-optional-reason.js",
        "reception-management.js",
        "scripts/qa-reception-management.js"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "warranty-browser": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020",
          "with": {
            "node-version": 22
          }
        },
        {
          "name": "Install locked project dependencies",
          "run": "npm ci --ignore-scripts"
        },
        {
          "name": "Install fixed browser test dependency",
          "run": "npm install --prefix \"$RUNNER_TEMP/warranty-browser\" --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1\n\"$RUNNER_TEMP/warranty-browser/node_modules/.bin/playwright\" install --with-deps chromium"
        },
        {
          "name": "Verify PC and mobile warranty, customer and pricing screens",
          "env": {
            "WARRANTY_PLAYWRIGHT_MODULE": "${{ runner.temp }}/warranty-browser/node_modules/playwright",
            "WARRANTY_QA_OUTPUT": "${{ runner.temp }}/warranty-qa-results"
          },
          "run": "node scripts/qa-sales-product-warranty.js\nnode scripts/qa-category-warranty-admin.js\nnode scripts/qa-customer-category-master.js\nnode scripts/qa-hanbaiou-billing-settings.js\nnode scripts/qa-sales-pricing-copy.js\nnode scripts/qa-order-claim-intake.js\nnode scripts/qa-sales-pricing-ranks.js\nnode scripts/qa-container-stock-screen.js\nnode scripts/qa-finished-label-print.js\nnode scripts/qa-production-report-ranks.js\nnode scripts/qa-mitsubishi-master-search.js\nnode scripts/qa-part-number-alignment.js\nnode scripts/qa-sales-order-inventory.js\nnode scripts/qa-shipping-print-actions.js\nnode scripts/qa-operation-logs.js\nnode scripts/qa-warehouse-optional-reason.js\nnode scripts/qa-reception-management.js"
        },
        {
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "warranty-browser-qa",
            "path": "${{ runner.temp }}/warranty-qa-results",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
