name: Postal data update

on:
  schedule:
    - cron: "17 3 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postal-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Download current Japan Post data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dcats-postal"
          curl --fail --location --retry 3 \
            --user-agent "D-CATS postal data updater" \
            "https://www.post.japanpost.jp/service/search/zipcode/download/utf/zip/utf_ken_all.zip" \
            --output "$RUNNER_TEMP/dcats-postal/utf_ken_all.zip"
          unzip -q "$RUNNER_TEMP/dcats-postal/utf_ken_all.zip" -d "$RUNNER_TEMP/dcats-postal"
      - name: Generate compact browser data
        run: node scripts/update-postal-data.js --input "$RUNNER_TEMP/dcats-postal/utf_ken_all.csv"
      - name: Verify generated postal data
        run: node scripts/verify-postal-data.js
      - name: Verify postal lookup fallback
        run: node scripts/verify-postal-lookup-fallback.js
      - name: Check application syntax
        run: node --check app.js
      - name: Verify customer order workflow
        run: node scripts/verify-customer-order-workflow.js
      - name: Verify release asset versions
        run: node scripts/verify-app-version-assets.js
      - name: Build static deployment
        run: node scripts/build-static-site.js
      - name: Verify response headers
        run: node scripts/verify-security-response-headers.js dist
      - name: Detect postal data changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- assets/postal; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload postal data candidate
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postal-data-candidate-${{ github.run_id }}
          path: assets/postal/
          if-no-files-found: error
          retention-days: 14
          compression-level: 9
      - name: Record postal data candidate
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          {
            echo "## Postal data candidate created"
            echo
            echo "- Artifact: \`postal-data-candidate-${GITHUB_RUN_ID}\`"
            echo "- Retention: 14 days from this run"
            echo "- Trust: treat the authenticated artifact as an untrusted candidate"
            echo "- Next: independently regenerate and verify the data, then use the normal reviewed PR path described in \`docs/customer-order-b2-manual-contract.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Record unchanged postal data
        if: steps.changes.outputs.changed == 'false'
        shell: bash
        run: |
          {
            echo "## Postal data"
            echo
            echo "No generated postal data changes were found; no candidate artifact was created."
          } >> "$GITHUB_STEP_SUMMARY"
