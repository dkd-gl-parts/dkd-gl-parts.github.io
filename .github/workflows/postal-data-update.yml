name: Postal data update

on:
  schedule:
    - cron: "17 3 3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: postal-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download current Japan Post data
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/dcats-postal"
          curl --fail --location --retry 3 \
            --user-agent "D-CATS postal data updater" \
            "https://www.post.japanpost.jp/service/search/zipcode/download/utf/zip/utf_ken_all.zip" \
            --output "$RUNNER_TEMP/dcats-postal/utf_ken_all.zip"
          unzip -q "$RUNNER_TEMP/dcats-postal/utf_ken_all.zip" -d "$RUNNER_TEMP/dcats-postal"
      - name: Generate compact browser data
        run: node scripts/update-postal-data.js --input "$RUNNER_TEMP/dcats-postal/utf_ken_all.csv"
      - name: Verify generated postal data
        run: node scripts/verify-postal-data.js
      - name: Verify postal lookup fallback
        run: node scripts/verify-postal-lookup-fallback.js
      - name: Check application syntax
        run: node --check app.js
      - name: Verify customer order workflow
        run: node scripts/verify-customer-order-workflow.js
      - name: Verify release asset versions
        run: node scripts/verify-app-version-assets.js
      - name: Build static deployment
        run: node scripts/build-static-site.js
      - name: Verify response headers
        run: node scripts/verify-security-response-headers.js dist
      - name: Detect postal data changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- assets/postal; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit updated postal data
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/postal
          git commit -m "Update Japan Post postal data"
          git push origin "HEAD:${GITHUB_REF_NAME}"
